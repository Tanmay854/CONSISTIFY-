name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 60

    env:
      IOS_DIR: ios/App
      SCHEME: App
      WORKSPACE: App.xcworkspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "No Xcode found on runner"; exit 1; fi
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Raise pods deployment target (CI only)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          # Modern Xcode drops support for very old deployment targets.
          # This edit lives only on the runner, never in the repo.
          sed -i '' "s/platform :ios, '.*'/platform :ios, '15.6'/" Podfile
          grep "platform :ios" Podfile

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.IOS_DIR }}
        run: |
          pod --version || sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Build app (code signing disabled)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .app into .ipa
        working-directory: ${{ env.IOS_DIR }}
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle produced"; exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf payload && mkdir -p payload/Payload
          cp -R "$APP_PATH" payload/Payload/
          (cd payload && zip -qry ../App-unsigned.ipa Payload)
          ls -lh App-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: ios/App/App-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
